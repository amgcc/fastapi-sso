[project]
name = "fastapi-sso"
version = "0.1.0"
description = "FastAPI SSO lab with Microsoft Entra OIDC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3",
    "fastapi>=0.115",
    "httpx2>=2.16.2",
    "itsdangerous>=2.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "black~=25.11",
    "mypy>=2.4.1",
    "pre-commit>=4.0",
    "pytest>=9.2.0",
    "types-authlib>=1.9.10.20261123",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["lib"]

[tool.mypy]
python_version = "3.12"
files = ["lib"]
exclude = ["lib/tests/"]

[tool.uv]
package = false
